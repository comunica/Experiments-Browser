name: Benchmark

on:
  workflow_dispatch:
    inputs:
      comunica_ref:
        description: Comunica branch, tag or commit to build
        default: master
      browsers:
        description: Comma-separated browsers
        default: chromium,firefox,webkit
      ldbc_browsers:
        description: Browsers for LDBC SNB (one repetition takes about 1.5 hours per browser)
        default: chromium
  schedule:
    # Monthly, on the 1st at 03:17 UTC.
    - cron: '17 3 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      COMUNICA_REF: ${{ inputs.comunica_ref || 'master' }}
      BENCH_MACHINE: github-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (prepare builds Comunica at COMUNICA_REF and installs the browsers)
        run: npm ci
      - name: Browser system dependencies
        run: npx playwright install-deps chromium firefox webkit
      - name: Prepare
        run: npm run prepare
      - name: Build
        run: npm run build
      - name: Reference counts
        id: reference
        # Recomputed into a copy, so the benchmark classifies against the committed counts and a change in the
        # engines' answers shows up as `wrong`. A disagreement between the engines is reported in the PR.
        continue-on-error: true
        run: |
          cp -r data /tmp/data-committed
          status=0
          npm run reference || status=$?
          mkdir -p reference-recomputed
          for f in data/*/reference.json; do cp "$f" "reference-recomputed/$(basename "$(dirname "$f")").json"; done
          for d in /tmp/data-committed/*/; do cp "$d/reference.json" "data/$(basename "$d")/reference.json" 2>/dev/null || true; done
          exit "$status"
      - name: Benchmark
        id: bench
        run: |
          out="results/$(date -u +%Y-%m-%d)-github-runner"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          npm run bench -- --out "$out" --mode support --browsers "${{ inputs.browsers || 'chromium,firefox,webkit' }}"
          npm run bench -- --out "$out" --mode timing --datasets watdiv-1,watdiv-10,bsbm-100,bsbm-1k \
            --browsers "${{ inputs.browsers || 'chromium,firefox,webkit' }}"
          npm run bench -- --out "$out" --mode timing --datasets ldbc-snb-0.1 \
            --browsers "${{ inputs.ldbc_browsers || 'chromium' }}"
      - name: Aggregate and plot
        run: |
          npm run aggregate -- "${{ steps.bench.outputs.out }}"
          npm run plot -- "${{ steps.bench.outputs.out }}"
      - name: Open a pull request with the results
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bench/${{ github.run_id }}
          add-paths: |
            results/
            reference-recomputed/
          commit-message: Add benchmark results from ${{ steps.bench.outputs.out }}
          title: >-
            ${{ steps.reference.outcome == 'failure' && '[reference disagreement] ' || '' }}Benchmark results:
            ${{ steps.bench.outputs.out }}
          labels: github-runner
          body: |
            Results of workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            on a GitHub-hosted `ubuntu-latest` runner, Comunica `${{ env.COMUNICA_REF }}`.

            Reference counts step: **${{ steps.reference.outcome }}**${{ steps.reference.outcome == 'failure' && ' (Oxigraph and Comunica disagree on at least one query; see the job log and `reference-recomputed/`)' || '' }}.
            The browser runs are classified against the committed `data/*/reference.json`; the counts recomputed with this
            Comunica build are in `reference-recomputed/`.

            LDBC SNB ran in: ${{ inputs.ldbc_browsers || 'chromium' }}, one repetition.
            See `${{ steps.bench.outputs.out }}/README.md`. Shared runners are noisy: compare engines within one run, not across runs.
